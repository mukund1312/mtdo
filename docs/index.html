<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mtdo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="crt">
  <div class="term-frame" id="frame">
    <div class="term-topbar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <p class="term-title">mtdo — zsh — 128×48</p>
      <span class="term-clock" id="clock"></span>
    </div>
    <div class="term-output" id="output"></div>
    <div class="term-inputrow">
      <span class="term-prompt" id="promptA">mtdo</span><span class="term-path" id="promptB">@focus:~$</span>
      <input id="cmdInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type 'help' or 'tour'…" />
      <span class="touring-badge" id="touringBadge" style="display:none">touring… ctrl+c to skip</span>
    </div>
  </div>
</div>

<script src="js/app.js"></script>

</body></html>
