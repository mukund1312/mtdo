[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtdo"
version = "0.2.0"
description = "A config-driven terminal task board: Kanban tasks, focus/pomodoro, streaks, career CRM, notes vault, a Learning Coach panel, and Spotify controls, all keyboard-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=0.60",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pyte>=0.8.1",
    "cryptography>=41.0",  # real at-rest encryption for password-protected profiles, see profiles.py
]

[project.optional-dependencies]
spotify = []  # Spotify controls use AppleScript on macOS -- no extra package needed, just macOS + Spotify.app
webchat = ["anthropic", "openai", "google-generativeai"]  # browser-free API chat options in the AI panel picker -- see ai_backend.py / web_chat.py
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
mtdo = "mtdo.cli:main"
mtdo-sandbox = "mtdo.sandbox_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtdo = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
