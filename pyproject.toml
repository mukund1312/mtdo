[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtdo"
version = "0.1.0"
description = "A config-driven terminal task board: Kanban tasks, focus/pomodoro, streaks, career CRM, notes vault, a Learning Coach panel, and Spotify controls, all keyboard-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=0.60",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pyte>=0.8.1",
]

[project.optional-dependencies]
spotify = []  # Spotify controls use AppleScript on macOS -- no extra package needed, just macOS + Spotify.app
webchat = ["anthropic", "openai"]  # last-resort AI panel backend when there's no Claude Code/Ollama -- see ai_backend.py

[project.scripts]
mtdo = "mtdo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtdo = ["*.yaml", "*.json"]
