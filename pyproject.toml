[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtdo"
version = "0.2.0"
description = "A terminal practice system for interview and skill prep -- track what to study, get coached through it, and prove you're improving, keyboard-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=0.60",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pyte>=0.8.1",
    "cryptography>=41.0",  # real at-rest encryption for password-protected profiles, see profiles.py
]

[project.optional-dependencies]
spotify = []  # Spotify controls use AppleScript on macOS -- no extra package needed, just macOS + Spotify.app
webchat = ["anthropic", "openai", "google-generativeai", "keyring"]  # browser-free API chat options in the AI panel picker -- see ai_backend.py / web_chat.py. keyring: OS keychain storage for API keys (gh41), soft dependency -- absence/no-backend falls back to the chmod'd secrets.json file, never crashes
youtube = ["yt-dlp"]  # Knowledge Vault's "paste a YouTube URL" -> AI notes + quiz (gh23) -- see youtube_notes.py. Captions only, no video/audio download.
vinyl = ["textual-image>=0.13"]  # Radio screen's spinning-vinyl visual (gh -- cliamp UI) -- purely decorative, soft dependency: radio.has_vinyl_support() checks it's importable and skips the visual entirely if not (station playback itself never needs it). Pulls in Pillow transitively.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
mtdo = "mtdo.cli:main"
mtdo-sandbox = "mtdo.sandbox_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtdo = ["*.yaml", "*.json", "*.mp4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
