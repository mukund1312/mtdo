name: CI (web)

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
