name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Path-based fan-out. `needs:` can't span workflow files, and GitHub's
  # required-status-checks feature doesn't understand path filters -- a
  # required check from a path-filtered workflow simply never reports on a
  # PR outside its path, and GitHub blocks the merge forever waiting on it.
  # Verified live: PR #107 (supabase/** + docs/** only) merged with no
  # `build` check at all, only bypassed because enforce_admins was off.
  # Fix: one workflow file, one always-runs `gate` job as the only required
  # context, three real jobs that skip cleanly when their path didn't change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            supabase:
              - 'supabase/**'
              - '.github/workflows/ci.yml'

  python-tests:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mtdo + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Syntax check (py_compile)
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest tests/ -v

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # NEXT_PUBLIC_* vars get inlined into the client bundle at build time --
    # without them here, `npm run build` silently bakes in `undefined` for
    # the Supabase URL/anon key rather than failing loudly. Safe to store as
    # repo secrets even though they're not sensitive (they ship to the
    # browser by design, per dev-split-plan.md §8) -- simplest consistent
    # place to keep them.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  web-e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # playwright.config.ts's webServer runs `next build && next start` --
    # without these, the built app has no way to reach Supabase at all, and
    # every test times out waiting on UI that depends on a session ever
    # existing. Found live: PR #128's E2E run failed in CI (60s timeout on
    # "route is ready") despite passing twice locally, because this job had
    # zero env vars set.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  supabase-tests:
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql

      - name: Run migration + rollup test suite
        run: |
          PGBIN_DIR=$(find /usr/lib/postgresql -maxdepth 2 -type d -name bin | head -1)
          export PATH="$PGBIN_DIR:$PATH"
          ./supabase/tests/run.sh

  # The single required status check. Passes when every job that actually
  # ran succeeded, and when every job that didn't run was correctly skipped
  # (its path didn't change) -- never blocks on a job that had no reason to
  # run. `if: always()` is required so this job still runs (and can fail
  # deliberately) even when an upstream job failed.
  gate:
    needs: [changes, python-tests, web-build, web-e2e, supabase-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all applicable jobs succeeded
        run: |
          # `changes` is checked here too, not just depended on: it has no
          # `if:`, so it can only ever be success or a genuine failure, never
          # "skipped" -- but if it fails (checkout flake, dorny/paths-filter
          # erroring), every job below it evaluates its `if:` against empty
          # outputs, reports "skipped" (not "failure"), and this loop would
          # see three clean skips and pass with zero tests having run. That's
          # the exact silently-ungated-merge failure this gate exists to
          # close, reached through the one job that talks to the network.
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.python-tests.result }}" \
            "${{ needs.web-build.result }}" \
            "${{ needs.web-e2e.result }}" \
            "${{ needs.supabase-tests.result }}"; do
            echo "job result: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job failed or was cancelled."
              exit 1
            fi
          done
          echo "All applicable checks passed (or were correctly skipped)."
